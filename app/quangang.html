<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全钢中央台拆单 · All-Steel Bench Splitter</title>
<style>
:root{
  --paper:#f1f1ea;
  --surface:#fbfbf6;
  --ink:#15181a;
  --ink-2:#39403f;
  --muted:#75796f;
  --rule:#d7d8cd;
  --rule-2:#b3b6a9;
  --grid:#e4e5da;
  --steel:#2c5f7c;
  --cab:#1e2326;
  --cab-2:#3c4447;
  --verm:#bf4527;
  --verm-soft:#fbf0eb;
  --ok:#2c6b4e;
  --font-ui:"Bahnschrift","DIN Alternate","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"Cascadia Mono","Consolas","SFMono-Regular",ui-monospace,monospace;
  --ease:cubic-bezier(.165,.84,.44,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font-ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;opacity:.5;
}

/* ================= 骨架 ================= */
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:grid;
  grid-template-columns:298px minmax(0,1fr);
  grid-template-rows:50px minmax(0,1fr);
}

/* ---------- 顶栏 ---------- */
.bar{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 16px;background:var(--surface);border-bottom:1px solid var(--rule-2);
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{
  width:8px;height:8px;background:var(--verm);flex:0 0 auto;transform:translateY(-2px);
}
.brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .en{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
.bar-actions{display:flex;align-items:center;gap:6px}
.btn-s{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 10px;background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;
}
.btn-s:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- 左栏 ---------- */
.panel{
  background:var(--surface);border-right:1px solid var(--rule);
  padding:16px 16px 12px;display:flex;flex-direction:column;gap:14px;
  min-height:0;overflow:hidden;
}
.panel h2{
  margin:0 0 -4px;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);font-weight:600;
}
.field-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.05em;color:var(--ink-2);margin-bottom:2px}
.field-label span{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);letter-spacing:.12em}
.input-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--rule-2);transition:border-color .25s var(--ease)}
.input-wrap:focus-within{border-color:var(--ink)}
.input-wrap input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-.02em;
  color:var(--ink);padding:2px 0 1px;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.input-wrap input::-webkit-outer-spin-button,.input-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.input-wrap .unit{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-bottom:5px}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{
  font-family:var(--font-mono);font-size:10.5px;padding:3px 6px;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  cursor:pointer;transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#f7f7f2}
.chip--min{border-color:var(--verm);color:var(--verm)}
.chip--min[aria-pressed="true"]{background:var(--verm);border-color:var(--verm);color:#fff}

.segbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--rule-2)}
.segbar button{
  font-family:var(--font-ui);font-size:12px;padding:6px 3px;background:transparent;border:0;
  border-right:1px solid var(--rule-2);cursor:pointer;color:var(--ink-2);
  transition:all .2s var(--ease);letter-spacing:.03em;white-space:nowrap;
}
.segbar button:last-child{border-right:0}
.segbar button[aria-pressed="true"]{background:var(--ink);color:#f7f7f2}
.segbar button:hover:not([aria-pressed="true"]){background:#eeeee6}

.derived{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:8px;
  background:#efeddf;border-left:2px solid var(--ink);padding:4px 8px;
}
.derived span{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.derived b{font-family:var(--font-mono);font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.summary{margin-top:2px;border-top:1px solid var(--rule-2);padding-top:10px}
.summary dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11.5px}
.summary dt{color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;align-self:center}
.summary dd{margin:0;text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.summary dd small{font-weight:400;color:var(--muted);font-size:10px;margin-left:2px}
.summary dd .best{color:var(--ok)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:7px}
.pair-item{display:flex;align-items:baseline;gap:4px;min-width:0;border-bottom:2px solid var(--rule-2);transition:border-color .25s var(--ease)}
.pair-item:focus-within{border-color:var(--ink)}
.pair-item input{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-family:var(--font-mono);font-size:21px;font-weight:600;letter-spacing:-.02em;
  color:var(--ink);padding:1px 0 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.pair-item input::-webkit-outer-spin-button,.pair-item input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pair-item .unit{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);padding-bottom:3px}
.times{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-bottom:5px}
.switch{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{
  appearance:none;width:14px;height:14px;border:1px solid var(--rule-2);background:#fff;
  cursor:pointer;position:relative;flex:0 0 auto;transition:all .2s var(--ease);
}
.switch input:checked{background:var(--verm);border-color:var(--verm)}
.switch input:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.switch:hover input{border-color:var(--ink)}

.cmp-mini{margin-top:2px;border-top:1px solid var(--rule);padding-top:8px}
.cmp-mini h3{margin:0 0 4px;font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cmp-mini button{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  background:transparent;border:0;border-bottom:1px dashed var(--rule);padding:4px 3px;cursor:pointer;
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-2);text-align:left;transition:background .2s var(--ease);
}
.cmp-mini button:hover{background:#f2f1e7}
.cmp-mini button[aria-pressed="true"]{background:#efeddf;color:var(--ink);font-weight:600}
.cmp-mini .c{font-weight:600;white-space:nowrap}
.cmp-mini .best{color:var(--ok);font-size:8.5px;margin-left:3px;letter-spacing:.06em}
.panel-note{
  margin-top:auto;font-family:var(--font-mono);font-size:10px;line-height:1.6;
  color:var(--muted);letter-spacing:.02em;border-top:1px solid var(--rule);padding-top:9px;
}

/* ---------- 右栏 ---------- */
.stage{display:flex;flex-direction:column;gap:9px;min-height:0;padding:11px 14px 12px;overflow:hidden}
.stage.is-error{justify-content:center}
/* ---------- 结果主视觉 ---------- */
.hero{flex:0 0 auto;border-left:3px solid var(--verm);padding-left:14px;min-width:0}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.hero-tag{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
}
.hero-tag .sep{color:var(--rule-2)}
.hero-tag b{color:var(--ink-2);font-weight:600}
.hero-body{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:1px;min-width:0}
.hero-main{
  font-size:clamp(19px,2.2vw,30px);font-weight:700;letter-spacing:-.028em;line-height:1.06;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.hero-main em{font-style:normal;color:var(--rule-2);font-weight:400;margin:0 5px}
.ok-chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--ok);color:#fff;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;padding:2px 7px;white-space:nowrap;
}
.ok-chip.warn{background:var(--verm)}
.kpi{display:grid;grid-template-columns:auto auto;gap:3px 20px;flex:0 0 auto}
.kpi > div{display:flex;align-items:baseline;gap:6px;min-width:0}
.kpi span{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.kpi b{font-family:var(--font-mono);font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
.kpi .hi b{color:var(--verm)}
.warn-line{
  flex:0 0 auto;font-family:var(--font-mono);font-size:10.5px;color:var(--verm);
  letter-spacing:.02em;margin-top:-4px;
}
.tabs{display:flex;gap:5px;flex:0 1 auto;min-width:0}
.tab{
  border:1px solid var(--rule-2);background:transparent;padding:4px 8px;cursor:pointer;
  font-family:var(--font-mono);font-size:10px;color:var(--ink-2);
  transition:all .2s var(--ease);white-space:nowrap;
}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#f7f7f2;border-color:var(--ink)}
.tab .k{opacity:.55;margin-right:4px}

/* ---------- 图纸 ---------- */
.sheet{
  margin:0;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--rule);position:relative;
}
.sheet::before{content:"";position:absolute;top:-1px;left:-1px;width:8px;height:8px;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.sheet::after{content:"";position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink)}
.sheet-head{
  flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:5px 12px;border-bottom:1px solid var(--rule);
}
.sheet-head .t{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.sheet-head .s{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);text-align:right}
.sheet-body{flex:1 1 auto;min-height:0;display:flex;padding:4px 6px}
.sheet-body svg{display:block;width:100%;height:100%}
.sheet-body text{font-family:var(--font-mono);fill:var(--ink-2)}
.sheet-body .dw-name{font-family:var(--font-ui);font-size:11px;fill:#eef0ea;letter-spacing:.1em;opacity:.92}
.sheet-body .dw-len{font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:-.01em}
.sheet-body .dw-slot-name{font-family:var(--font-ui);font-size:11px;fill:var(--verm);letter-spacing:.1em}
.sheet-body .dw-slot-len{font-size:13px;font-weight:600;fill:var(--verm)}
.sheet-body .dw-dim{font-size:10.5px;fill:#5c625d}
.sheet-body .dw-sum{font-size:11px;fill:var(--ink);font-weight:600}
.sheet-body .dw-anno{font-size:9.5px;fill:#a8ac9f;letter-spacing:.16em}
.sheet-legend{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:3px 13px;
  padding:3px 12px;border-top:1px solid var(--rule);
  font-family:var(--font-mono);font-size:9.5px;color:var(--ink-2);
}
.sheet-legend .li{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sheet-legend .sw{display:block;width:15px;height:8px;border:1px solid rgba(0,0,0,.3);flex:0 0 auto}
.sw--top{background:#e6e4d8;border-color:#b3b6a9}
.sw--water{background:var(--steel)}
.sw--dbl{background:var(--cab)}
.sw--sgl{background:var(--cab-2)}
.sw--slot{background:repeating-linear-gradient(45deg,rgba(191,69,39,.45) 0 3px,transparent 3px 6px);border:1px dashed var(--verm)}
.sheet-legend .sep{flex:1}
.sheet-legend .kv{color:var(--muted)}
.sheet-legend .kv b{color:var(--ink);font-weight:600}

/* ---------- 清单 ---------- */
.list{flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.list table{width:100%;border-collapse:collapse;font-size:12px}
.list thead th{
  text-align:left;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--ink);padding:0 8px 5px 0;
}
.list tbody td{padding:3px 8px 3px 0;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;font-size:12.5px}
.list tbody tr:hover{background:#f3f3ec}
.list td.num{font-family:var(--font-mono);text-align:right;padding-right:0;white-space:nowrap;font-size:13px;font-weight:600;color:var(--ink)}
.list td.name{font-weight:600;white-space:nowrap}
.list td.name .tag{
  display:inline-block;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;
  padding:0 4px;margin-left:5px;vertical-align:1px;border:1px solid currentColor;opacity:.7;
}
.list td.spec{font-family:var(--font-mono);color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.list td.spec .sub{display:block;font-size:9px;color:var(--muted);letter-spacing:.04em;margin-top:1px}
.list tr.row--top td{background:#f4f3ec}
.list tr.row--slot td.name,.list tr.row--slot td.spec{color:var(--verm)}
.list tr.row--water td.name,.list tr.row--water td.spec{color:var(--steel)}
.list tfoot td{padding:4px 8px 0 0;font-weight:600;font-size:12px;border:0}
.list tfoot tr.tot td{background:#efeddf;border-top:1px solid var(--ink);padding:5px 8px 5px 0;font-size:13.5px;font-weight:700}
.list tfoot tr.tot td.num{font-size:15px}
.list tfoot td.num{font-family:var(--font-mono);text-align:right;padding-right:0}
.list tfoot tr.sub td{font-weight:400;color:var(--muted);font-size:11px;padding-top:2px}
.list .x2{color:var(--muted);font-size:10px;margin-left:2px}

/* ---------- 底栏 ---------- */
.stage-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.seq{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.03em;
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.seq i{font-style:normal;color:var(--verm)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px;cursor:pointer;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--ink);background:var(--ink);color:#f7f7f2;transition:all .22s var(--ease);
  white-space:nowrap;
}
.btn:hover{background:transparent;color:var(--ink)}

/* ---------- 弹层 ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(20,24,26,.34);backdrop-filter:blur(2px);
}
.modal.on{display:flex;align-items:center;justify-content:center;padding:24px}
.modal-card{
  width:min(760px,100%);max-height:min(84vh,720px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--ink);box-shadow:0 18px 50px rgba(20,24,26,.22);
}
.modal-card header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;border-bottom:1px solid var(--rule-2);
}
.modal-card h3{margin:0;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.modal-card .close{
  border:0;background:transparent;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 4px;
}
.modal-card .close:hover{color:var(--verm)}
.modal-body{padding:16px;overflow-y:auto}

.steps .step{display:grid;grid-template-columns:60px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.steps .no{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;color:var(--verm)}
.steps .body{font-size:13px;color:var(--ink-2);line-height:1.6}
.steps .body .f{font-family:var(--font-mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.steps .body .m{color:var(--muted)}
.steps .body .r{color:var(--verm);font-weight:600;font-family:var(--font-mono)}

.rules{margin:16px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);line-height:1.75}
.rules li{padding-left:14px;position:relative;margin-bottom:5px}
.rules li::before{content:"—";position:absolute;left:0;color:var(--rule-2)}
.rules b{color:var(--ink-2);font-weight:600}

.spec-mat{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.spec-mat button{
  font-family:var(--font-ui);font-size:12px;padding:5px 13px;background:transparent;
  border:1px solid var(--rule-2);color:var(--ink-2);cursor:pointer;transition:all .2s var(--ease);
}
.spec-mat button:hover{border-color:var(--ink);color:var(--ink)}
.spec-mat button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#f7f7f2}
.spec-mat .spec-active{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:var(--muted)}
.spec-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.spec-card{border:1px solid var(--rule);background:#fff;padding:10px 10px 6px}
.spec-card h4{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.spec-card h4 span{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.14em;color:var(--muted);font-weight:400}
.spec-card label{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.spec-card input{width:100%;border:1px solid var(--rule-2);background:#fff;outline:none;padding:3px 5px;font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.spec-card input:focus{border-color:var(--ink)}
.spec-line{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);flex-wrap:wrap}
.spec-line .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:56px}
.spec-line label{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.spec-line input{width:66px;border:1px solid var(--rule-2);background:#fff;outline:none;padding:3px 5px;font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.spec-line input:focus{border-color:var(--ink)}
.spec-line .hint{font-size:10px;color:var(--muted)}
.modal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.modal-foot .hint{font-size:11px;color:var(--muted)}

.cmp{width:100%;border-collapse:collapse;font-size:12px}
.cmp th{
  text-align:left;font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--rule-2);padding:0 8px 6px 0;font-weight:600;
}
.cmp td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.cmp td.num{font-family:var(--font-mono);text-align:right;padding-right:0;white-space:nowrap}
.cmp th[style*="right"]{padding-right:0}
.cmp tr.is-best td{background:#f0f4ee}
.cmp .tagbest{
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;padding:1px 4px;margin-left:5px;
  border:1px solid var(--ok);color:var(--ok);
}
.cmp .tagnorm{border-color:var(--rule-2);color:var(--muted)}
.cmp .combo{font-family:var(--font-mono);font-size:11.5px;color:var(--ink)}
.cmp .sub{display:block;font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.02em}

/* ---------- 错误态 ---------- */
.error-box{border:1px solid var(--verm);background:var(--verm-soft);padding:18px 20px;color:var(--verm);font-size:13.5px;line-height:1.7;max-width:820px}
.error-box b{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.error-box .hint{color:var(--ink-2);margin-top:7px;font-size:12.5px}
.error-box button{
  margin-top:12px;font-family:var(--font-mono);font-size:11px;padding:6px 12px;
  background:var(--verm);color:#fff;border:0;cursor:pointer;letter-spacing:.08em;
}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--ink);color:#f7f7f2;font-family:var(--font-mono);font-size:11.5px;
  padding:8px 15px;letter-spacing:.08em;opacity:0;pointer-events:none;
  transition:all .3s var(--ease);z-index:70;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 自适应 ---------- */
@media (max-height:760px){
  .list table{font-size:11.5px}
  .list tbody td{padding:3px 8px 3px 0}
  .list tfoot tr.sub{display:none}
  .panel{gap:11px;padding-top:12px}
  .brand h1{font-size:15px}
}
@media (max-width:1100px){
  .app{grid-template-columns:266px minmax(0,1fr)}
  .brand .en{display:none}
}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  body::before{display:none}
  .app{display:block;height:auto}
  .bar,.panel,.tabs,.stage-foot,.modal,.toast{display:none!important}
  .stage{padding:0;display:block}
  .sheet{height:420px;break-inside:avoid}
  .list{margin-top:12px}
  .list table{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===================== CORE-BEGIN (pure logic) ===================== */

/**
 * 把总长按份数均分，优先按 5mm 为步长取整（读数更工整），
 * 尾差再以 1mm 补齐，保证 Σ 精确等于 total
 */
function splitEven(total, n) {
  if (n <= 0) return [];
  const step = 5;
  const base = Math.floor(total / (n * step)) * step;
  const arr = new Array(n).fill(base);
  let rest = Math.round(total - base * n);
  let i = 0;
  while (rest >= step) { arr[i % n] += step; rest -= step; i++; }
  while (rest > 0) { arr[i % n] += 1; rest -= 1; i++; }
  return arr;
}

/**
 * 在给定余量 Lr 与空位数 n 下，枚举所有 (双柜 k, 单柜 m) 组合
 * 约束：k*dblL + m*sglL + Σslot = Lr，每个 slot ∈ [slotMin, slotMax]
 * 且空位数不得超过该组合能放下的数量（见 maxSlots，受严格/标准模式影响）
 */
function findSolutions(Lr, n, cfg) {
  const out = [];
  if (Lr <= 0 || n < 0) return out;
  const maxK = Math.floor(Lr / cfg.dblL);
  for (let k = maxK; k >= 0; k--) {
    for (let m = 0; m <= cfg.maxSingles; m++) {
      const cab = k * cfg.dblL + m * cfg.sglL;
      const rem = Lr - cab;
      if (k + m === 0) continue;
      if (rem < -0.5) continue;
      if (n > maxSlots(k, m, cfg.strict)) continue;
      if (n === 0) {
        if (Math.abs(rem) <= 0.5) out.push({ k, m, slots: [], cabLen: cab, slotSum: 0 });
        continue;
      }
      if (rem < n * cfg.slotMin - 0.5) continue;
      if (rem > n * cfg.slotMax + 0.5) continue;
      const slots = splitEven(rem, n);
      if (slots.some(v => v < cfg.slotMin || v > cfg.slotMax)) continue;
      out.push({ k, m, slots, cabLen: cab, slotSum: rem });
    }
  }
  return out;
}

/**
 * 该柜体组合最多能放下多少个空位
 * strict = true：空位只能夹在两个不同规格的柜体之间（交替）
 * strict = false：标准模式，只要空位互不相邻即可
 */
function maxSlots(k, m, strict) {
  if (strict) {
    if (k === 0 || m === 0) return 0;
    return k === m ? 2 * k - 1 : 2 * Math.min(k, m);
  }
  return Math.max(0, k + m - 1);
}

/** 严格模式：把 k 个双柜、m 个单柜排成“异规格相邻”最多的交替块 */
function buildBlocks(k, m) {
  const blocks = [];
  if (k === 0 && m === 0) return blocks;
  if (m === 0) return [{ type: 'dbl', n: k }];
  if (k === 0) return [{ type: 'sgl', n: m }];
  if (k > m) {
    const dn = m + 1, base = Math.floor(k / dn), extra = k % dn;
    for (let i = 0; i < dn; i++) {
      blocks.push({ type: 'dbl', n: base + (i < extra ? 1 : 0) });
      if (i < m) blocks.push({ type: 'sgl', n: 1 });
    }
  } else if (m > k) {
    const sn = k + 1, base = Math.floor(m / sn), extra = m % sn;
    for (let i = 0; i < sn; i++) {
      blocks.push({ type: 'sgl', n: base + (i < extra ? 1 : 0) });
      if (i < k) blocks.push({ type: 'dbl', n: 1 });
    }
  } else {
    for (let i = 0; i < k; i++) {
      blocks.push({ type: 'dbl', n: 1 });
      blocks.push({ type: 'sgl', n: 1 });
    }
  }
  return blocks;
}

/** 柜体排列顺序：严格模式用交替块；标准模式双柜居中、单柜放中段，整体对称 */
function buildOrder(k, m, strict) {
  const cabs = [];
  if (strict) {
    buildBlocks(k, m).forEach(b => { for (let i = 0; i < b.n; i++) cabs.push(b.type); });
    return cabs;
  }
  if (k === 0) return new Array(m).fill('sgl');
  if (m === 0) return new Array(k).fill('dbl');
  const left = Math.ceil(k / 2), right = k - left;
  return [...new Array(left).fill('dbl'), ...new Array(m).fill('sgl'), ...new Array(right).fill('dbl')];
}

/**
 * 排布：空位均匀落在可用接缝上，绝不出现两个空位相邻
 * 严格模式下接缝只取“两侧规格不同”的位置
 */
function arrange(k, m, slots, strict) {
  const warnings = [];
  const cabs = buildOrder(k, m, strict);

  const bounds = [];
  for (let i = 0; i < cabs.length - 1; i++) {
    if (!strict || cabs[i] !== cabs[i + 1]) bounds.push(i);
  }

  const n = slots.length;
  if (n === 0) return { seq: cabs, warnings };

  const use = Math.min(n, bounds.length);
  if (use < n) warnings.push(`该柜体组合最多只能放下 ${bounds.length} 个空位`);

  const picked = new Set();
  for (let i = 0; i < use; i++) {
    const at = use === 1
      ? bounds[Math.floor((bounds.length - 1) / 2)]
      : bounds[Math.round(i * (bounds.length - 1) / (use - 1))];
    picked.add(at);
  }
  for (const bd of bounds) { if (picked.size >= use) break; picked.add(bd); }

  const seq = [];
  cabs.forEach((c, i) => {
    seq.push(c);
    if (picked.has(i)) seq.push('slot');
  });
  return { seq, warnings };
}

/* ===================== CORE-END ===================== */

const MATERIALS = ['全钢', '钢木', '不锈钢'];

/* 每种材质各自一套产品规格（长/深/高 + 成本指数） */
const DEFAULT_SPECS = {
  '全钢': {
    water: { L: 700, D: 1440, H: 850 },
    dbl:   { L: 900, D: 750, H: 850 },
    sgl:   { L: 450, D: 750, H: 850 },
    slot:  { min: 500, max: 800, D: 750, H: 850 },
    costDbl: 100, costSgl: 58
  },
  '钢木': {
    water: { L: 700, D: 1440, H: 850 },
    dbl:   { L: 900, D: 750, H: 850 },
    sgl:   { L: 450, D: 750, H: 850 },
    slot:  { min: 500, max: 800, D: 750, H: 850 },
    costDbl: 78, costSgl: 46
  },
  '不锈钢': {
    water: { L: 700, D: 1440, H: 850 },
    dbl:   { L: 900, D: 750, H: 850 },
    sgl:   { L: 450, D: 750, H: 850 },
    slot:  { min: 500, max: 800, D: 750, H: 850 },
    costDbl: 145, costSgl: 84
  }
};

const BASE = DEFAULT_SPECS['全钢'];
const DEFAULTS = {
  totalL: 4500, totalW: 1500, waterCount: 1, overhang: 30, overhangReal: 25,
  material: '全钢', waterBody: 520, waterExt: 180,
  waterL: BASE.water.L, waterW: BASE.water.D, waterH: BASE.water.H,
  dblL: BASE.dbl.L, dblD: BASE.dbl.D, dblH: BASE.dbl.H,
  sglL: BASE.sgl.L, sglD: BASE.sgl.D, sglH: BASE.sgl.H,
  slotMin: BASE.slot.min, slotMax: BASE.slot.max, slotD: BASE.slot.D, slotH: BASE.slot.H,
  ratio: 0.3, unit: 500, maxSingles: 2, sides: 2, strict: false,
  costDbl: BASE.costDbl, costSgl: BASE.costSgl
};

const state = {
  ...DEFAULTS,
  specs: JSON.parse(JSON.stringify(DEFAULT_SPECS)),
  solIndex: 0
};
let specEditMat = state.material;

/** 把某材质的规格同步到当前生效字段 */
function applyMaterial(mat) {
  const sp = state.specs[mat];
  if (!sp) return;
  state.material = mat;
  state.waterL = sp.water.L; state.waterW = sp.water.D; state.waterH = sp.water.H;
  state.dblL = sp.dbl.L; state.dblD = sp.dbl.D; state.dblH = sp.dbl.H;
  state.sglL = sp.sgl.L; state.sglD = sp.sgl.D; state.sglH = sp.sgl.H;
  state.slotMin = sp.slot.min; state.slotMax = sp.slot.max; state.slotD = sp.slot.D; state.slotH = sp.slot.H;
  state.costDbl = sp.costDbl; state.costSgl = sp.costSgl;
}
applyMaterial('全钢');
const $ = s => document.querySelector(s);
const fmt = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
const PRESETS = [3000, 3600, 4200, 4500, 4800, 5400, 6000];

/* ---------- 计算 ---------- */
function pick(Lr, n) {
  const cfg = { ...state, maxSingles: Math.max(3, Math.ceil(n / 2) + 1) };
  const raw = findSolutions(Lr, n, cfg);
  const built = raw.map((s, i) => {
    const { seq, warnings } = arrange(s.k, s.m, s.slots, state.strict);
    return { ...s, seq, warnings, index: i };
  });
  const valid = built.filter(s => s.warnings.length === 0);
  const invalid = built.filter(s => s.warnings.length > 0);
  const seen = new Set();
  const dedupe = list => list.filter(v => {
    if (seen.has(v.cabLen)) return false;
    seen.add(v.cabLen);
    return true;
  });
  const all = dedupe(valid).concat(dedupe(invalid));
  if (state.strict) {
    const perfect = v => (v.k + v.m - 1 === v.slots.length && Math.abs(v.k - v.m) <= 1) ? 0 : 1;
    all.sort((a, b) => perfect(a) - perfect(b) || b.k - a.k || a.m - b.m);
  } else {
    // 标准模式：先大后小（双柜优先），同等双柜数时单柜少者优先
    all.sort((a, b) => b.k - a.k || a.m - b.m);
  }
  return { all, structural: valid.length > 0 };
}

function evaluate(totalL) {
  const S = state;
  const bodyL = totalL - 2 * S.overhang;
  const bodyD = S.totalW - 2 * S.overhang;
  const waterTotal = S.waterCount * S.waterL;
  const Lr = bodyL - waterTotal;

  if (!isFinite(totalL) || totalL <= 0) return { error: '请输入有效的台面长度' };
  if (bodyL <= 0) return { error: '台面长度小于沿边两倍，无法形成柜体' };
  if (Lr <= 0) return { error: `台面长度不足以容纳 ${S.waterCount} 个水柜（需 > ${waterTotal + 2 * S.overhang} mm）` };

  const nRaw = Lr * S.ratio / S.unit;
  const nIdeal = Math.max(0, Math.round(nRaw));

  let nUsed = nIdeal, note = '', picked = pick(Lr, nIdeal);

  if (!picked.all.length) {
    for (const c of [nIdeal - 1, nIdeal + 1, nIdeal - 2, nIdeal + 2]) {
      if (c < 0) continue;
      const p2 = pick(Lr, c);
      if (p2.all.length) {
        picked = p2; nUsed = c;
        note = `按公式应为 ${nIdeal} 个空位，但该数量无法配平，实际采用 ${c} 个。`;
        break;
      }
    }
  }
  if (!picked.all.length) {
    return { error: '当前尺寸无法精确拆单', nearest: nearestFeasible(totalL), bodyL, bodyD, Lr, nIdeal };
  }

  return {
    ok: true, totalL, bodyL, bodyD, Lr, waterTotal,
    nIdeal, nUsed, nRaw, note, sols: picked.all.slice(0, 4)
  };
}

let _minKey = '', _minVal = null;
/** 含至少 1 个空位的最小可行台面长度（按当前材质/水柜配置） */
function minFeasible() {
  const key = [state.material, state.waterCount, state.strict, state.ratio,
    state.totalW, state.overhang, state.dblL, state.sglL, state.slotMin, state.slotMax].join('|');
  if (key === _minKey) return _minVal;
  let v = null;
  for (let t = 900; t <= 6000; t += 10) {
    const r = evaluate(t);
    if (r.ok && r.sols.some(x => x.slots.length > 0)) { v = t; break; }
  }
  _minKey = key; _minVal = v;
  return v;
}

function nearestFeasible(totalL) {
  for (let d = 10; d <= 800; d += 10) {
    for (const sign of [-1, 1]) {
      const t = totalL + sign * d;
      if (t < 800) continue;
      const r = evaluateRaw(t);
      if (r && r.length) return t;   // 空数组也是 truthy，必须判长度
    }
  }
  return null;
}
function evaluateRaw(totalL) {
  const S = state;
  const bodyL = totalL - 2 * S.overhang;
  const Lr = bodyL - S.waterCount * S.waterL;
  if (Lr <= 0) return null;
  const n = Math.max(0, Math.round(Lr * S.ratio / S.unit));
  return findSolutions(Lr, n, { ...S, maxSingles: Math.max(3, Math.ceil(n / 2) + 1) });
}

/* ---------- 分段 ---------- */
function buildSegments(sol) {
  const S = state;
  const list = [];
  if (S.waterCount >= 1) list.push({ type: 'water', L: S.waterL, name: '水柜' });
  let si = 0;
  sol.seq.forEach(t => {
    if (t === 'slot') list.push({ type: 'slot', L: sol.slots[si++], name: '空位' });
    else if (t === 'dbl') list.push({ type: 'dbl', L: S.dblL, name: '双柜' });
    else list.push({ type: 'sgl', L: S.sglL, name: '单柜' });
  });
  if (S.waterCount >= 2) list.push({ type: 'water', L: S.waterL, name: '水柜' });
  return list;
}

function solutionTitle(sol) {
  const S = state;
  const parts = [];
  if (sol.k) parts.push(`${sol.k}×双柜${S.dblL}`);
  if (sol.m) parts.push(`${sol.m}×单柜${S.sglL}`);
  const uniq = [...new Set(sol.slots)];
  if (uniq.length === 1) parts.push(`${sol.slots.length}×空位${uniq[0]}`);
  else if (uniq.length > 1) parts.push(`${sol.slots.length}×空位${uniq.join('/')}`);
  return parts.join(' + ');
}

function solutionTabLabel(sol, i) {
  const letter = String.fromCharCode(65 + i);
  return { letter, text: `${sol.k}双柜${sol.m ? `+${sol.m}单柜` : ''}+${sol.slots.length}空位` };
}

/* ---------- 俯视图 ---------- */
function buildPlanSVG(segs, sol, res) {
  const S = state;
  const L = S.totalL, W = S.totalW, ov = S.overhang;
  const sides = S.sides;
  const VW = 980, M = { l: 76, r: 74, t: 44, b: 86 };
  const k = Math.min((VW - M.l - M.r) / L, 420 / W);
  const pw = L * k, ph = W * k;
  const VH = M.t + ph + M.b;
  const x0 = (VW - pw) / 2, y0 = M.t;
  const x1 = x0 + pw, y1 = y0 + ph;
  const bx = x0 + ov * k, by = y0 + ov * k;
  const bw = res.bodyL * k, bh = res.bodyD * k;
  const rowD = sides === 2 ? bh / 2 : Math.min(S.dblD * k, bh);
  const f = n => Math.round(n * 100) / 100;
  const P = [];

  const hDim = (xa, xb, y, text, side, cls) => {
    const ty = side === 'above' ? y - 5 : y + 12;
    return `<line x1="${f(xa)}" y1="${f(y)}" x2="${f(xb)}" y2="${f(y)}" stroke="#a9ada2" stroke-width="1"/>` +
      `<line x1="${f(xa)}" y1="${f(y - 4)}" x2="${f(xa)}" y2="${f(y + 4)}" stroke="#5c625d" stroke-width="1"/>` +
      `<line x1="${f(xb)}" y1="${f(y - 4)}" x2="${f(xb)}" y2="${f(y + 4)}" stroke="#5c625d" stroke-width="1"/>` +
      `<text class="${cls || 'dw-dim'}" x="${f((xa + xb) / 2)}" y="${f(ty)}" text-anchor="middle">${text}</text>`;
  };
  const vDim = (x, ya, yb, text, side, cls) => {
    const ym = (ya + yb) / 2;
    const tx = side === 'left' ? x - 5 : x + 5;
    return `<line x1="${f(x)}" y1="${f(ya)}" x2="${f(x)}" y2="${f(yb)}" stroke="#a9ada2" stroke-width="1"/>` +
      `<line x1="${f(x - 4)}" y1="${f(ya)}" x2="${f(x + 4)}" y2="${f(ya)}" stroke="#5c625d" stroke-width="1"/>` +
      `<line x1="${f(x - 4)}" y1="${f(yb)}" x2="${f(x + 4)}" y2="${f(yb)}" stroke="#5c625d" stroke-width="1"/>` +
      `<text class="${cls || 'dw-dim'}" x="${f(tx)}" y="${f(ym)}" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 ${f(tx)} ${f(ym)})">${text}</text>`;
  };

  P.push(`<defs><pattern id="gapHatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="#bf4527" stroke-width="1.2" opacity=".38"/></pattern></defs>`);

  /* 台面 + 柜体轮廓 */
  P.push(`<rect x="${f(x0)}" y="${f(y0)}" width="${f(pw)}" height="${f(ph)}" fill="#e6e4d8" stroke="#15181a" stroke-width="1.4"/>`);
  P.push(`<rect x="${f(bx)}" y="${f(by)}" width="${f(bw)}" height="${f(bh)}" fill="#fbfaf5" stroke="#a9ada2" stroke-width="1" stroke-dasharray="7 4"/>`);

  /* 段位 */
  let cx = bx;
  const placed = segs.map(sg => {
    const o = { sg, x: cx, w: sg.L * k };
    cx += o.w;
    return o;
  });

  /* 单排柜体 */
  const drawRow = (yTop, handleTop) => {
    placed.forEach(({ sg, x, w }) => {
      if (sg.type === 'water' || sg.type === 'slot') return;
      P.push(`<rect x="${f(x)}" y="${f(yTop)}" width="${f(w)}" height="${f(rowD)}" fill="${sg.type === 'dbl' ? '#1e2326' : '#3c4447'}" stroke="#0f1214" stroke-width="1"/>`);
      if (sides === 2) {
        const cy = by + bh / 2;
        P.push(`<line x1="${f(x)}" y1="${f(cy)}" x2="${f(x + w)}" y2="${f(cy)}" stroke="#8d9186" stroke-width=".8" stroke-dasharray="3 4" opacity=".5"/>`);
      }
      const doors = sg.type === 'dbl' ? 2 : 1;
      for (let d = 1; d < doors; d++) {
        const dx = x + (w / doors) * d;
        P.push(`<line x1="${f(dx)}" y1="${f(yTop)}" x2="${f(dx)}" y2="${f(yTop + rowD)}" stroke="#5b6367" stroke-width="1"/>`);
      }
      const hw = Math.min(26, (w / doors) * 0.5);
      for (let d = 0; d < doors; d++) {
        const dc = x + (w / doors) * (d + 0.5);
        const hy = handleTop ? yTop + 9 : yTop + rowD - 9;
        P.push(`<rect x="${f(dc - hw / 2)}" y="${f(hy)}" width="${f(hw)}" height="3.2" rx="1.6" fill="#9aa1a4"/>`);
      }
      if (w >= 38 && rowD >= 46) {
        P.push(`<text class="dw-name" x="${f(x + w / 2)}" y="${f(yTop + rowD / 2 - 3)}" text-anchor="middle">${sg.name}</text>`);
        P.push(`<text class="dw-len" x="${f(x + w / 2)}" y="${f(yTop + rowD / 2 + 13)}" text-anchor="middle">${sg.L}</text>`);
      } else if (w >= 24) {
        P.push(`<text class="dw-len" x="${f(x + w / 2)}" y="${f(yTop + rowD / 2 + 4)}" text-anchor="middle" font-size="11">${sg.L}</text>`);
      }
    });
  };

  drawRow(by, true);
  if (sides === 2) drawRow(by + bh - rowD, false);

  /* 空位：贯通整个柜体深度的单一空缺 */
  const slotH = sides === 2 ? bh : rowD;
  placed.filter(p => p.sg.type === 'slot').forEach(({ sg, x, w }) => {
    P.push(`<rect x="${f(x)}" y="${f(by)}" width="${f(w)}" height="${f(slotH)}" fill="url(#gapHatch)" stroke="#bf4527" stroke-width="1.1" stroke-dasharray="6 4"/>`);
    if (w >= 40 && slotH >= 66) {
      P.push(`<text class="dw-slot-name" x="${f(x + w / 2)}" y="${f(by + slotH / 2 - 4)}" text-anchor="middle">空位</text>`);
      P.push(`<text class="dw-slot-len" x="${f(x + w / 2)}" y="${f(by + slotH / 2 + 12)}" text-anchor="middle">${sg.L}</text>`);
    } else if (w >= 24) {
      P.push(`<text class="dw-slot-len" x="${f(x + w / 2)}" y="${f(by + slotH / 2 + 4)}" text-anchor="middle" font-size="11">${sg.L}</text>`);
    }
  });

  /* 水柜：贯通整个柜体深度 */
  placed.filter(p => p.sg.type === 'water').forEach(({ sg, x, w }) => {
    P.push(`<rect x="${f(x)}" y="${f(by)}" width="${f(w)}" height="${f(bh)}" fill="#2c5f7c" stroke="#123047" stroke-width="1"/>`);
    const labelSpace = 24;
    const availH = Math.max(bh - 20 - labelSpace, 22);
    const sh = Math.min(bh * 0.4, 84, availH);
    const sw = Math.min(w * 0.54, 82, w - 10);
    const scx = x + w / 2, scy = by + 20 + availH / 2;
    P.push(`<rect x="${f(scx - sw / 2)}" y="${f(scy - sh / 2)}" width="${f(sw)}" height="${f(sh)}" rx="7" fill="#eaf3f8" stroke="#123047" stroke-width="1"/>`);
    P.push(`<circle cx="${f(scx)}" cy="${f(scy + sh * 0.16)}" r="3.2" fill="#123047"/>`);
    P.push(`<circle cx="${f(scx)}" cy="${f(by + 13)}" r="4.2" fill="none" stroke="#cfe3ee" stroke-width="1.3"/>`);
    P.push(`<line x1="${f(scx)}" y1="${f(by + 17.2)}" x2="${f(scx)}" y2="${f(scy - sh / 2 - 2)}" stroke="#cfe3ee" stroke-width="1.1"/>`);
    if (w >= 50 && bh >= 128) {
      P.push(`<text class="dw-name" x="${f(scx)}" y="${f(by + bh - 22)}" text-anchor="middle">水柜</text>`);
      P.push(`<text class="dw-len" x="${f(scx)}" y="${f(by + bh - 8)}" text-anchor="middle">${sg.L}</text>`);
    } else if (w >= 56) {
      P.push(`<text class="dw-len" x="${f(scx)}" y="${f(by + bh - 7)}" text-anchor="middle" font-size="10.5">水柜 ${sg.L}</text>`);
    } else {
      P.push(`<text class="dw-len" x="${f(scx)}" y="${f(by + bh - 7)}" text-anchor="middle" font-size="10">${sg.L}</text>`);
    }
  });

  /* 尺寸链 */
  P.push(`<line x1="${f(x0)}" y1="${f(y0 - 5)}" x2="${f(x0)}" y2="${f(y0 - 26)}" stroke="#d5d6cc" stroke-width="1"/>`);
  P.push(`<line x1="${f(x1)}" y1="${f(y0 - 5)}" x2="${f(x1)}" y2="${f(y0 - 26)}" stroke="#d5d6cc" stroke-width="1"/>`);
  P.push(hDim(x0, x1, y0 - 22, `台面 ${fmt(L)}`, 'above', 'dw-sum'));

  let dx = bx;
  segs.forEach(sg => {
    const w = sg.L * k;
    P.push(`<line x1="${f(dx)}" y1="${f(y1 + 5)}" x2="${f(dx)}" y2="${f(y1 + 30)}" stroke="#d5d6cc" stroke-width="1"/>`);
    P.push(hDim(dx, dx + w, y1 + 25, `${sg.L}`, 'below'));
    dx += w;
  });
  P.push(`<line x1="${f(bx + bw)}" y1="${f(y1 + 5)}" x2="${f(bx + bw)}" y2="${f(y1 + 30)}" stroke="#d5d6cc" stroke-width="1"/>`);
  P.push(hDim(bx, bx + bw, y1 + 56, `柜体 ${fmt(res.bodyL)}`, 'below', 'dw-sum'));

  P.push(vDim(x0 - 20, by, by + bh, `${fmt(res.bodyD)}`, 'left'));
  P.push(vDim(x1 + 26, y0, y1, `${fmt(W)}`, 'right'));

  return `
  <figure class="sheet">
    <div class="sheet-head">
      <span class="t">${state.material}中央台俯视图 · Plan</span>
      <span class="s">${sides === 2 ? '双面对称' : '单面'} ｜ 单位 mm ｜ 尺寸以标注为准</span>
    </div>
    <div class="sheet-body">
      <svg viewBox="0 0 ${VW} ${f(VH)}" data-seq="${segs.map(g => g.type).join(',')}" role="img" aria-label="中央台俯视图，台面 ${fmt(L)}×${fmt(W)} 毫米">${P.join('')}</svg>
    </div>
    <div class="sheet-legend">
      <span class="li"><i class="sw sw--top"></i>台面 / 沿边 ${ov}</span>
      <span class="li"><i class="sw sw--water"></i>水柜</span>
      <span class="li"><i class="sw sw--dbl"></i>双柜</span>
      <span class="li"><i class="sw sw--sgl"></i>单柜</span>
      <span class="li"><i class="sw sw--slot"></i>空位</span>
      <span class="sep"></span>
      <span class="kv">水柜 ${state.waterL} = ${state.waterBody} + ${state.waterExt} ｜ 柜体深 ${state.dblD} ｜ 空位 ${state.slotMin}–${state.slotMax}</span>
    </div>
  </figure>`;
}

/* ---------- 渲染 ---------- */
function render() {
  const stage = $('#stage');
  paintPresets();
  const res = evaluate(state.totalL);

  if (res.error) {
    $('#derived').style.display = 'none';
    $('#cmpMini').style.display = 'none';
    stage.classList.add('is-error');
    stage.innerHTML = `
      <div class="hero">
        <div class="hero-head"><div class="hero-tag"><span>无法拆单</span></div></div>
        <div class="hero-body"><div class="hero-main" style="color:var(--verm)">${res.error}</div></div>
      </div>
      <div class="error-box">
        <b>No feasible split</b>
        ${res.bodyL ? `柜体外形 ${fmt(res.bodyL)} × ${fmt(res.bodyD)} mm，可排余量 ${fmt(res.Lr)} mm，按公式应有 ${res.nIdeal} 个空位。<br>
        ${state.strict
          ? `受交替规则限制，${res.nIdeal} 个空位至少需要 ${res.nIdeal + 1} 个柜体（双柜、单柜交替）才能隔开`
          : `空位必须夹在柜体之间，${res.nIdeal} 个空位至少需要 ${res.nIdeal + 1} 个柜体才能隔开`}，且柜体长度合计必须由 ${state.dblL} 与 ${state.sglL} 组合得出，本尺寸凑不出，可放宽或收紧台面长度。` : res.error}
        ${res.nearest ? `<div class="hint">最接近的可行台面长度：<strong style="font-family:var(--font-mono)">${res.nearest} mm</strong></div>
        <button type="button" id="btnFix">采用 ${res.nearest} mm 重新计算</button>` : ''}
      </div>`;
    const fix = $('#btnFix');
    if (fix) fix.onclick = () => { $('#inLen').value = res.nearest; state.totalL = res.nearest; render(); };
    return;
  }

  if (state.solIndex >= res.sols.length) state.solIndex = 0;
  const sol = res.sols[state.solIndex];
  const segs = buildSegments(sol);
  const total = segs.reduce((a, s) => a + s.L, 0);
  const sides = state.sides;
  const perSide = sol.k + sol.m;

  const tabs = res.sols.length > 1 ? `
    <div class="tabs" role="tablist">
      ${res.sols.map((s, i) => {
        const l = solutionTabLabel(s, i);
        return `<button class="tab" role="tab" aria-selected="${i === state.solIndex}" data-i="${i}"><span class="k">${l.letter}</span>${l.text}</button>`;
      }).join('')}
    </div>` : '';

  const costNow = sol.k * state.costDbl + sol.m * state.costSgl;
  const kindNow = (sol.k ? 1 : 0) + (sol.m ? 1 : 0);
  const minCost = Math.min(...res.sols.map(x => x.k * state.costDbl + x.m * state.costSgl));
  const uniqSlots = [...new Set(sol.slots)];

  const heroParts = [];
  if (sol.k) heroParts.push(`${sol.k} × 双柜 ${state.dblL}`);
  if (sol.m) heroParts.push(`${sol.m} × 单柜 ${state.sglL}`);
  if (sol.slots.length) heroParts.push(`${sol.slots.length} × 空位 ${uniqSlots.length === 1 ? uniqSlots[0] : uniqSlots.join('/')}`);

  const closed = total === res.bodyL;
  const head = `
    <div class="hero">
      <div class="hero-head">
        <div class="hero-tag">
          <span>方案 ${String.fromCharCode(65 + state.solIndex)}</span>
          <span class="sep">/</span><span>${sides === 2 ? '双面对称' : '单面'}</span>
          <span class="sep">/</span><span>成本 <b>${costNow}</b>${costNow === minCost && res.sols.length > 1 ? '（最低）' : ''}</span>
          <span class="sep">/</span><span>规格 <b>${kindNow}</b> 种</span>
          <span class="ok-chip ${closed ? '' : 'warn'}">${closed ? '✓' : '!'} 合计 ${fmt(total)}</span>
        </div>
        ${tabs}
      </div>
      <div class="hero-body">
        <div class="hero-main">${heroParts.join(' <em>+</em> ')}</div>
        <div class="kpi">
          <div><span>台面</span><b>${fmt(state.totalL)}×${fmt(state.totalW)}</b></div>
          <div><span>柜体</span><b>${fmt(res.bodyL)}×${fmt(res.bodyD)}</b></div>
          <div><span>余量</span><b>${fmt(res.Lr)}</b></div>
          <div class="hi"><span>空位</span><b>${sol.slots.length ? `${sol.slots.length}×${uniqSlots.join('/')}` : '—'}</b></div>
        </div>
      </div>
    </div>`;

  /* 清单 */
  const rows = [];
  rows.push({ cls: 'row--top', name: '台面', tag: 'TOP', spec: `${fmt(state.totalL)}×${fmt(state.totalW)}（沿边 ${state.overhang}）`, qty: '1', sum: state.totalL });
  if (state.waterCount >= 1) {
    rows.push({ cls: 'row--water', name: '水柜', tag: 'SINK', spec: `${state.waterL}×${state.waterW}×${state.waterH}`, sub: `${state.waterBody} 柜体 + ${state.waterExt} 延伸`, qty: String(state.waterCount), sum: state.waterCount * state.waterL });
  }
  if (sol.k) rows.push({ cls: '', dbl: 1, name: '双柜', tag: 'DBL', spec: `${state.dblL}×${state.dblD}×${state.dblH}`, qty: String(sol.k), sum: sol.k * state.dblL });
  if (sol.m) rows.push({ cls: '', dbl: 1, name: '单柜', tag: 'SGL', spec: `${state.sglL}×${state.sglD}×${state.sglH}`, qty: String(sol.m), sum: sol.m * state.sglL });
  const groups = {};
  sol.slots.forEach(l => { groups[l] = (groups[l] || 0) + 1; });
  Object.keys(groups).map(Number).sort((a, b) => a - b).forEach(l => {
    rows.push({ cls: 'row--slot', name: '空位', tag: 'GAP', spec: `${l}×${state.slotD}×${state.slotH}`, qty: String(groups[l]), sum: groups[l] * l });
  });

  const list = `
    <section class="list">
      <table>
        <thead><tr>
          <th>名称</th><th>规格 / 尺寸 (mm)</th>
          <th style="text-align:right">数量${sides === 2 ? '（单侧×2）' : ''}</th>
          <th style="text-align:right">${sides === 2 ? '单侧长度' : '长度小计'}</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr class="${r.cls}">
            <td class="name">${r.name}<span class="tag">${r.tag}</span></td>
            <td class="spec">${r.spec}${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</td>
            <td class="num">${r.qty}${sides === 2 && r.dbl ? '<span class="x2">×2</span>' : ''}</td>
            <td class="num">${fmt(r.sum)}</td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr class="tot"><td colspan="3">柜体合计（单侧）</td><td class="num">${fmt(total)}</td></tr>
          <tr class="sub"><td colspan="3">台面（整片，含沿边）</td><td class="num">${fmt(state.totalL)}</td></tr>
        </tfoot>
      </table>
    </section>`;

  const okText = total === res.bodyL
    ? `合计 ${fmt(total)} mm ＝ 柜体总长 ${fmt(res.bodyL)} mm，与台面 ${fmt(state.totalL)} − ${2 * state.overhang} 吻合`
    : `合计 ${fmt(total)} mm 与柜体总长 ${fmt(res.bodyL)} mm 存在 ${fmt(total - res.bodyL)} mm 偏差`;
  const warn = res.note || (sol.warnings.length ? sol.warnings.join('；') : '');

  const seqText = segs.map(sg => sg.type === 'slot' ? `<i>${sg.name}${sg.L}</i>` : `${sg.name}${sg.L}`).join(' · ');
  const foot = `
    <div class="stage-foot">
      <span class="seq">${seqText}</span>
      <button class="btn" id="btnCopy" type="button">复制清单</button>
    </div>`;

  const warnLine = warn ? `<div class="warn-line">${warn}</div>` : '';
  stage.innerHTML = head + warnLine + buildPlanSVG(segs, sol, res) + list + foot;

  const gapRatio = (sol.slotSum / res.Lr * 100);
  stage.classList.remove('is-error');
  $('#derived').style.display = '';
  $('#cmpMini').style.display = '';
  $('#derived').innerHTML = `<span>净柜体</span><b>${fmt(res.bodyL)} × ${fmt(res.bodyD)}</b>`;
  $('#derived').title = `台面 − 四边沿边 ${2 * state.overhang}mm；空位占比 ${gapRatio.toFixed(1)}%`;

  stage.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { state.solIndex = Number(b.dataset.i); render(); };
  });
  $('#btnCopy').onclick = () => copyList(res, sol, segs, total);

  const mini = res.sols.slice(0, 3).map((s2, i) => {
    const c = s2.k * state.costDbl + s2.m * state.costSgl;
    const best = c === minCost && res.sols.length > 1;
    return `<button type="button" data-i="${i}" aria-pressed="${i === state.solIndex}">
      <span>${String.fromCharCode(65 + i)} · ${s2.k}双柜${s2.m ? `+${s2.m}单柜` : ''}+${s2.slots.length}空位</span>
      <span class="c">${c}${best ? '<span class="best">最低</span>' : ''}</span>
    </button>`;
  }).join('');
  $('#cmpMini').innerHTML = `<h3>方案比选</h3>${mini}`;
  $('#cmpMini').querySelectorAll('button').forEach(b => {
    b.onclick = () => { state.solIndex = Number(b.dataset.i); render(); };
  });
}

/* ---------- 弹层 ---------- */
function openModal(kind) {
  const modal = $('#modal');
  const title = $('#modalTitle');
  const body = $('#modalBody');

  if (kind === 'spec') {
    title.textContent = '规格参数 · 分材质';
    const sp = state.specs[specEditMat];
    const isActive = specEditMat === state.material;
    const card = (name, en, type, vals, fields) => `
      <div class="spec-card">
        <h4>${name}<span>${en}</span></h4>
        ${fields.map(([k, lb]) => `<label><span>${lb}</span><input type="number" step="10" data-t="${type}" data-k="${k}" value="${vals[k]}"></label>`).join('')}
      </div>`;
    body.innerHTML = `
      <div class="spec-mat">
        ${MATERIALS.map(m => `<button type="button" data-m="${m}" aria-pressed="${m === specEditMat}">${m}</button>`).join('')}
        <span class="spec-active">${isActive ? '当前使用中' : '未启用，仅存档'}</span>
      </div>
      <div class="spec-cards">
        ${card('水柜', 'SINK', 'water', sp.water, [['L', '长'], ['D', '深'], ['H', '高']])}
        ${card('双柜', 'DBL', 'dbl', sp.dbl, [['L', '长'], ['D', '深'], ['H', '高']])}
        ${card('单柜', 'SGL', 'sgl', sp.sgl, [['L', '长'], ['D', '深'], ['H', '高']])}
        ${card('空位', 'GAP', 'slot', sp.slot, [['min', '最小'], ['max', '最大'], ['D', '深'], ['H', '高']])}
      </div>
      <div class="spec-line">
        <span class="k">成本指数</span>
        <label>双柜<input id="cDbl" type="number" step="1" value="${sp.costDbl}"></label>
        <label>单柜<input id="cSgl" type="number" step="1" value="${sp.costSgl}"></label>
        <span class="hint">仅用于方案比选，非实际金额</span>
      </div>
      <div class="spec-line">
        <span class="k">通用</span>
        <label>桌面沿边<input id="sOver" type="number" step="1" value="${state.overhang}"></label>
        <label>空位率 %<input id="sRatio" type="number" step="1" min="1" max="60" value="${Math.round(state.ratio * 100)}"></label>
        <label>计算单位<input id="sUnit" type="number" step="50" value="${state.unit}"></label>
        <span class="hint">镶边实际 ${state.overhangReal}mm，计算按 ${state.overhang}mm 扣除</span>
      </div>
      <div class="modal-foot">
        <span class="hint">三种材质默认沿用同一套尺寸，可按各自产品目录调整；改动后立即重算</span>
        <button class="btn" type="button" id="btnReset">恢复默认</button>
      </div>`;
    bindSpec();
  } else if (kind === 'compare') {
    title.textContent = '方案比选 · 成本与规格权衡';
    const res = evaluate(state.totalL);
    if (res.error) {
      body.innerHTML = `<p class="hint">${res.error}</p>`;
    } else {
      const L = i => String.fromCharCode(65 + i);
      const rows = res.sols.map((s2, i) => {
        const cost = s2.k * state.costDbl + s2.m * state.costSgl;
        const kinds = (s2.k ? 1 : 0) + (s2.m ? 1 : 0);
        const u = [...new Set(s2.slots)];
        const slotTxt = s2.slots.length === 0 ? '—'
          : (u.length === 1 ? `${s2.slots.length}×${u[0]}` : s2.slots.join('/'));
        return { s: s2, i, cost, kinds, slotTxt };
      });
      const minCost = Math.min(...rows.map(r => r.cost));
      const minKind = Math.min(...rows.map(r => r.kinds));
      const cur = rows[state.solIndex];
      const best = rows.find(r => r.cost === minCost);
      const diff = cur.cost - minCost;
      const pct = cur.cost ? Math.round(diff / cur.cost * 100) : 0;

      body.innerHTML = `
        <table class="cmp">
          <thead><tr>
            <th>方案</th><th>柜体组合</th>
            <th style="text-align:right">空位宽度</th>
            <th style="text-align:right">成本指数</th>
            <th style="text-align:right">规格种类</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr class="${r.cost === minCost ? 'is-best' : ''}">
                <td><b>${L(r.i)}</b>
                  ${r.cost === minCost ? '<span class="tagbest">成本最优</span>' : ''}
                  ${r.kinds === minKind ? '<span class="tagbest tagnorm">标准库</span>' : ''}
                </td>
                <td>
                  <span class="combo">${r.s.k}×${state.dblL}${r.s.m ? ` + ${r.s.m}×${state.sglL}` : ''}</span>
                  <span class="sub">${r.s.k} 双柜${r.s.m ? ` + ${r.s.m} 单柜` : ''}，柜体合计 ${r.s.cabLen}mm</span>
                </td>
                <td class="num">${r.slotTxt}</td>
                <td class="num">${r.cost}</td>
                <td class="num">${r.kinds} 种</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <ul class="rules">
          <li>成本指数 = 双柜 × ${state.costDbl} ＋ 单柜 × ${state.costSgl}；空位与水柜各方案相同，不计入。</li>
          <li>${diff > 0
            ? `当前方案 ${L(cur.i)} 比最优方案 ${L(best.i)} 多 ${diff}（约 ${pct}%），但规格 ${cur.kinds} 种${cur.kinds < best.kinds ? '，库房更简单' : ''}。`
            : '当前方案已是成本最优解。'}</li>
          <li>规格种类越多，库房管理与生产换型成本越高；建议在<b>标准库方案</b>与<b>成本最优方案</b>之间按项目批量取舍。</li>
        </ul>`;
    }
  } else {
    const res = evaluate(state.totalL);
    title.textContent = '计算过程与规则';
    if (res.error) {
      body.innerHTML = `<p class="hint">${res.error}</p>`;
    } else {
      const sol = res.sols[state.solIndex];
      const segs = buildSegments(sol);
      const total = segs.reduce((a, s) => a + s.L, 0);
      const slotExpr = sol.slots.length
        ? (new Set(sol.slots).size === 1 ? `${sol.slots.length} × ${sol.slots[0]}` : sol.slots.join(' + '))
        : '0';
      body.innerHTML = `
        <div class="steps">
          <div class="step"><span class="no">STEP 01</span><span class="body">材质 <b>${state.material}</b>，台面 ${fmt(state.totalL)} × ${fmt(state.totalW)}；镶边实际 ${state.overhangReal}mm、计算按 ${state.overhang}mm 扣除 → 净柜体 <span class="f">${fmt(res.bodyL)} × ${fmt(res.bodyD)}</span> mm</span></div>
          <div class="step"><span class="no">STEP 02</span><span class="body">扣除水柜 ${state.waterCount} × ${state.waterL}（${state.waterBody} 柜体 + ${state.waterExt} 延伸）→ 可用长度 <span class="f">${fmt(res.bodyL)} − ${res.waterTotal} = ${fmt(res.Lr)}</span> mm</span></div>
          <div class="step"><span class="no">STEP 03</span><span class="body">空位数 = ${fmt(res.Lr)} × ${state.ratio * 100}% ÷ ${state.unit} = <span class="f">${res.nRaw.toFixed(2)}</span> <span class="m">→ 四舍五入</span> <span class="r">${res.nUsed} 个</span></span></div>
          <div class="step"><span class="no">STEP 04</span><span class="body">柜体长度 = ${fmt(res.Lr)} − ${sol.slots.length > 1 ? `（${slotExpr}）` : slotExpr} = ${fmt(res.Lr)} − ${sol.slotSum} = <span class="f">${fmt(sol.cabLen)}</span> mm <span class="m">→</span> ${[sol.k ? `${sol.k} × 双柜 ${state.dblL}` : '', sol.m ? `${sol.m} × 单柜 ${state.sglL}` : ''].filter(Boolean).join(' ＋ ') || '无柜体'}</span></div>
          <div class="step"><span class="no">STEP 05</span><span class="body">合验：${segs.map(s => s.L).join(' + ')} = <span class="f">${fmt(total)}</span> mm ＝ 柜体总长 ${fmt(res.bodyL)} mm</span></div>
        </div>
        <ul class="rules">
          <li>台面四边沿边 <b>${state.overhang}mm</b>，柜体 = 台面长/宽各减 ${2 * state.overhang}mm。</li>
          <li>空位数 = ROUND（余量 × ${state.ratio * 100}% ÷ ${state.unit}mm），本单取 <b>${res.nUsed}</b> 个。</li>
          ${state.strict
            ? `<li><b>严格模式</b>：空位只放在两个不同规格的柜体之间（双柜–空位–单柜–空位–双柜）；同规格柜体之间、端头、两个空位相连均不成立。</li>`
            : `<li><b>标准模式</b>：空位均匀落在柜体接缝上，<b>不靠端头、不出现连续两个空位</b>；同规格柜体之间允许放空位（如 3 双柜 + 2 空位）。</li>`}
          <li>空位长度在 <b>${state.slotMin}–${state.slotMax}mm</b> 内浮动，由余量均分得出，保证总长严格闭合。</li>
          <li>${res.nUsed} 个空位至少需要 <b>${res.nUsed + 1} 个柜体</b>才能隔开，故余量不足时会自动降为空位数或提示无解。</li>
          <li>柜体按<b>${state.sides === 2 ? '双面对称' : '单面'}</b>布置；清单数量为单侧值，双面时按 ×2 下单。</li>
          <li>空位率基准 <b>30%</b>，最高可上浮至 <b>40%</b>，前提是单个空位不超过 ${state.slotMax}mm；低于 ${state.slotMin}mm 腿部空间不足。</li>
          <li>柜体排布遵循<b>先大后小</b>：优先 ${state.dblL}mm 双柜，再用 ${state.sglL}mm 单柜补齐，空位宽度用于吸收余量。</li>
          <li>水柜固定于端头、位置不可调整，扣除后剩余长度全部用于排柜与空位。</li>
        </ul>`;
    }
  }
  modal.classList.add('on');
}

function closeModal() { $('#modal').classList.remove('on'); }

/* ---------- 复制 ---------- */
function copyList(res, sol, segs, total) {
  const S = state;
  const sides = S.sides;
  const mul = sides === 2 ? 2 : 1;
  const lines = [
    `【${S.material}中央台拆单】台面 ${fmt(S.totalL)} × ${fmt(S.totalW)} mm（四边沿边 ${S.overhang} mm）`,
    `柜体外形：${fmt(res.bodyL)} × ${fmt(res.bodyD)} mm ｜ ${sides === 2 ? '双面对称' : '单面'}布置`,
    '',
    `台面　${fmt(S.totalL)}×${fmt(S.totalW)}（含沿边 ${S.overhang}）　×1`,
    ...(S.waterCount ? [`水柜　${S.waterL}×${S.waterW}×${S.waterH}　×${S.waterCount}`] : []),
    ...(sol.k ? [`双柜　${S.dblL}×${S.dblD}×${S.dblH}　×${sol.k * mul}`] : []),
    ...(sol.m ? [`单柜　${S.sglL}×${S.sglD}×${S.sglH}　×${sol.m * mul}`] : []),
    ...sol.slots.map((l, i) => `空位${i + 1}　${l}×${S.slotD}×${S.slotH}${sides === 2 ? '（两侧各一）' : ''}`),
    '',
    `单侧长度合计 ${fmt(total)} mm ＝ 柜体总长 ${fmt(res.bodyL)} mm ✓`,
    `成本指数 ${sol.k * S.costDbl + sol.m * S.costSgl}（双柜 ${S.costDbl} / 单柜 ${S.costSgl}）`,
    `排布：${segs.map(s => `${s.name}${s.L}`).join(' | ')}`
  ];
  const text = lines.join('\n');
  const done = () => {
    const t = $('#toast'); t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
}

/* ---------- 事件 ---------- */
function bindSpec() {
  const body = $('#modalBody');

  body.querySelectorAll('button[data-m]').forEach(b => {
    b.onclick = () => { specEditMat = b.dataset.m; openModal('spec'); };
  });

  body.querySelectorAll('input[data-t]').forEach(inp => {
    inp.addEventListener('input', () => {
      const v = Number(inp.value);
      if (!isFinite(v) || v <= 0) return;
      state.specs[specEditMat][inp.dataset.t][inp.dataset.k] = v;
      if (specEditMat === state.material) {
        applyMaterial(state.material);
        state.solIndex = 0;
        render();
      }
    });
  });

  const costDbl = body.querySelector('#cDbl');
  const costSgl = body.querySelector('#cSgl');
  const onCost = () => {
    const a = Number(costDbl.value), b = Number(costSgl.value);
    if (!isFinite(a) || !isFinite(b) || a < 0 || b < 0) return;
    state.specs[specEditMat].costDbl = a;
    state.specs[specEditMat].costSgl = b;
    if (specEditMat === state.material) { applyMaterial(state.material); render(); }
  };
  if (costDbl) costDbl.addEventListener('input', onCost);
  if (costSgl) costSgl.addEventListener('input', onCost);

  const globals = { sOver: 'overhang', sUnit: 'unit' };
  Object.entries(globals).forEach(([id, key]) => {
    const el = body.querySelector('#' + id);
    if (!el) return;
    el.addEventListener('input', () => {
      const v = Number(el.value);
      if (!isFinite(v) || v <= 0) return;
      state[key] = v;
      state.solIndex = 0;
      render();
    });
  });

  const ratioEl = body.querySelector('#sRatio');
  if (ratioEl) ratioEl.addEventListener('input', () => {
    const pct = Number(ratioEl.value);
    if (!isFinite(pct) || pct <= 0) return;
    state.ratio = Math.round(pct) / 100;
    state.solIndex = 0;
    [...$('#segRatio').children].forEach(x => x.setAttribute('aria-pressed', String(Math.abs(Number(x.dataset.v) - state.ratio) < 0.001)));
    render();
  });

  const reset = body.querySelector('#btnReset');
  if (reset) reset.onclick = () => {
    state.specs = JSON.parse(JSON.stringify(DEFAULT_SPECS));
    Object.assign(state, {
      totalL: DEFAULTS.totalL, totalW: DEFAULTS.totalW, waterCount: DEFAULTS.waterCount,
      overhang: DEFAULTS.overhang, overhangReal: DEFAULTS.overhangReal,
      waterBody: DEFAULTS.waterBody, waterExt: DEFAULTS.waterExt,
      ratio: DEFAULTS.ratio, unit: DEFAULTS.unit, sides: DEFAULTS.sides,
      strict: DEFAULTS.strict, solIndex: 0
    });
    state.material = DEFAULTS.material;
    specEditMat = state.material;
    applyMaterial(state.material);
    $('#inLen').value = state.totalL;
    $('#inWid').value = state.totalW;
    [...$('#segWater').children].forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.v) === state.waterCount)));
    [...$('#segSides').children].forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.v) === state.sides)));
    [...$('#segRatio').children].forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.v) === state.ratio)));
    [...$('#segMat').children].forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === state.material)));
    const chk = $('#chkStrict');
    if (chk) chk.checked = state.strict;
    paintPresets();
    render();
    openModal('spec');
  };
}

function bind() {
  const inLen = $('#inLen');
  const inWid = $('#inWid');

  inLen.addEventListener('input', () => {
    const v = Number(inLen.value);
    state.totalL = v; state.solIndex = 0;
    if (v > 0) render();
    paintPresets();
  });
  inWid.addEventListener('input', () => {
    const v = Number(inWid.value);
    if (v > 0) { state.totalW = v; render(); }
  });

  $('#presets').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    state.totalL = Number(b.dataset.v);
    state.solIndex = 0;
    inLen.value = state.totalL;
    paintPresets(); render();
  });

  [['segWater', 'waterCount', true], ['segSides', 'sides', true],
   ['segRatio', 'ratio', true], ['segMat', 'material', false]].forEach(([id, key, num]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      state[key] = num ? Number(b.dataset.v) : b.dataset.v;
      if (key === 'material') applyMaterial(b.dataset.v);
      state.solIndex = 0;
      [...el.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      render();
    });
  });

  $('#chkStrict').addEventListener('change', e => {
    state.strict = e.target.checked;
    state.solIndex = 0;
    render();
  });

  document.querySelectorAll('[data-modal]').forEach(b => {
    b.onclick = () => openModal(b.dataset.modal);
  });
  $('#modalClose').onclick = closeModal;
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  $('#btnPrint').onclick = () => window.print();

  paintPresets();
}

function paintPresets() {
  const min = minFeasible();
  const head = min
    ? `<button type="button" class="chip chip--min" data-v="${min}" aria-pressed="${state.totalL === min}" title="含 1 个空位的最小可行台面">最小 ${min}</button>`
    : '';
  $('#presets').innerHTML = head + PRESETS.map(v =>
    `<button type="button" class="chip" data-v="${v}" aria-pressed="${state.totalL === v}">${v}</button>`
  ).join('');
}

bind();
render();
</script>
</body>
